services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${ESSAY_DB_NAME:-insquire}
      MARIADB_USER: ${ESSAY_DB_USER:-insquire}
      MARIADB_PASSWORD: ${ESSAY_DB_PASS:?Set ESSAY_DB_PASS in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
      - ./database:/sql:ro
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/00-initdb.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ESSAY_DB_HOST: db
    ports:
      - "8080:80"
    volumes:
      - rubrics:/var/www/html/storage/rubrics
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  rubrics:

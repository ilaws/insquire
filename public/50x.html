<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Server error | InsQuire</title>
    <style>
        :root {
            color-scheme: light;
            --green: #143d36;
            --gold: #e4b363;
            --orange: #c56a2d;
            --ink: #17231f;
            --muted: #61726b;
            --paper: #f4f7f5;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.55 Georgia, "Times New Roman", serif;
        }
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px clamp(20px, 6vw, 72px);
            border-bottom: 4px solid var(--gold);
            background: var(--green);
        }
        .logo {
            color: #fff;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: .03em;
            text-decoration: none;
        }
        .top a:not(.logo) {
            color: #e9f2ed;
            font: 15px Arial, sans-serif;
            text-decoration: none;
        }
        .wrap {
            width: min(92%, 900px);
            margin: 8vh auto;
        }
        .panel {
            padding: clamp(28px, 7vw, 72px);
            border: 1px solid #d7e2dc;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 24px #143d3610;
        }
        .eyebrow {
            color: var(--orange);
            font: 700 .8rem Arial, sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 16px;
            color: var(--green);
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1.1;
        }
        p { max-width: 620px; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }
        .button {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 4px;
            background: var(--orange);
            color: #fff;
            font: 700 15px Arial, sans-serif;
            text-decoration: none;
        }
        .button.alt { background: var(--green); }
        footer {
            width: min(92%, 900px);
            margin: 35px auto;
            color: var(--muted);
            text-align: center;
        }
        footer a { color: var(--green); }
    </style>
</head>
<body>
    <header class="top">
        <a class="logo" href="/">InsQuire</a>
        <a href="https://help.insquire.org">Help Center</a>
    </header>
    <main class="wrap">
        <section class="panel">
            <div class="eyebrow">Server error</div>
            <h1>InsQuire couldn’t complete that request.</h1>
            <p>The server encountered a temporary problem. Please try again shortly. If it continues, contact support and include what you were doing when it happened.</p>
            <div class="actions">
                <a class="button" href="/">Return to InsQuire</a>
                <a class="button alt" href="https://ticket.insquire.org">Open a Support Ticket</a>
            </div>
        </section>
    </main>
    <footer>
        <a href="https://help.insquire.org">Help</a> &middot;
        <a href="https://ticket.insquire.org">Support</a>
    </footer>
</body>
</html>
